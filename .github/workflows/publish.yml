name: Publish tested packs

# Every successful push CI run on master publishes the packs it built whose
# manifest version the registry does not have yet, so the registry follows
# master. A version already published is skipped: bump it to publish changes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI run on the current master commit (artifacts must still exist)
        required: true
        type: string
      packs:
        description: Space-separated pack names to publish (empty publishes every pack the run built)
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-packs
  cancel-in-progress: false

env:
  REGISTRY: https://registry.dev.gents.xyz

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
      PACK_NAMES: ${{ inputs.packs }}
    steps:
      - name: Check the source run
        id: source
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Run publishing from master.' >&2; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '
            .conclusion == "success" and .head_branch == "master" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/ci.yml"
          ' run.json >/dev/null
          # A run master has moved past is left to the newer run's publish.
          master_sha="$(gh api "repos/$GH_REPO/commits/master" --jq .sha)"
          if [[ "$(jq -r .head_sha run.json)" != "$master_sha" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_run ]] || { echo 'The run is not on the current master commit.' >&2; exit 1; }
            echo "::notice::Master moved past run $CI_RUN_ID; its successor publishes."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CI builds every pack on master, so a successful run's artifacts
          # name exactly the packs that still exist.
          BUILT_PACKS="$(gh api --paginate "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[].name | select(test("^pack-.+-Linux$")) | sub("^pack-"; "") | sub("-Linux$"; "")' \
            | sort -u | xargs)"
          [[ -n "$BUILT_PACKS" ]] || { echo 'The run built no packs.' >&2; exit 1; }
          PACK_NAMES="${PACK_NAMES:-$BUILT_PACKS}"
          for pack in $BUILT_PACKS $PACK_NAMES; do
            [[ "$pack" =~ ^[a-z][a-z0-9_]*$ ]] || { echo 'Invalid pack name.' >&2; exit 1; }
          done
          echo "BUILT_PACKS=$BUILT_PACKS" >> "$GITHUB_ENV"
          echo "PACK_NAMES=$PACK_NAMES" >> "$GITHUB_ENV"

      - name: Download and verify tested artifacts
        if: steps.source.outputs.stale != 'true'
        run: |
          set -euo pipefail
          gh run download "$CI_RUN_ID" --name gents-cli-Linux-X64 --dir gents-bin
          chmod +x gents-bin/gents
          for pack in $PACK_NAMES; do
            gh run download "$CI_RUN_ID" --name "pack-$pack-Linux" --dir dist
            gents-bin/gents pack verify "dist/gents.$pack.pack"
          done

      - name: Publish unpublished versions
        if: steps.source.outputs.stale != 'true'
        env:
          GENTS_REGISTRY_TOKEN: ${{ secrets.GENTS_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GENTS_REGISTRY_TOKEN" ]] || { echo 'Configure the GENTS_REGISTRY_TOKEN repository secret with publishing access to the gents namespace.' >&2; exit 1; }
          for pack in $PACK_NAMES; do
            file="dist/gents.$pack.pack"
            version="$(tar -xzOf "$file" pack.json | jq -r .version)"
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$REGISTRY/api/v1/packs/gents/$pack/$version")"
            case "$status" in
              200) echo "gents/$pack@$version is already published; skipping." ;;
              404) gents-bin/gents pack publish "$file" --registry "$REGISTRY" ;;
              *) echo "Checking gents/$pack@$version on the registry returned HTTP $status." >&2; exit 1 ;;
            esac
          done

      # Every gents pack comes from this repo, so one the registry still
      # offers but master no longer has is yanked (undo: gents pack yank --undo).
      - name: Yank packs deleted from the repo
        if: steps.source.outputs.stale != 'true'
        env:
          GENTS_REGISTRY_TOKEN: ${{ secrets.GENTS_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          page=1
          while :; do
            curl -fsS "$REGISTRY/api/v1/packs?q=&page=$page" > search.json
            jq -r '.packs[] | select(.namespace == "gents") | .name' search.json >> registry-packs.txt
            [[ "$(jq -r .has_more search.json)" == true ]] || break
            page=$((page + 1))
          done
          for pack in $(sort -u registry-packs.txt); do
            [[ " $BUILT_PACKS " == *" $pack "* ]] && continue
            for version in $(curl -fsS "$REGISTRY/api/v1/packs/gents/$pack" | jq -r '.versions[] | select(.yanked | not) | .version'); do
              gents-bin/gents pack yank "gents/$pack@$version" --registry "$REGISTRY"
            done
          done
