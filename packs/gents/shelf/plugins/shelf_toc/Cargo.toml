[workspace]
[package]
name = "shelf_toc"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "shelf_toc"
path = "source/main.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
base64 = "0.22"
hayro = { version = "0.7.1", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
hayro-syntax = { version = "0.7.2", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[dev-dependencies]
tempfile = "3"
[profile.release]
lto = true
strip = true
