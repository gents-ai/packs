[workspace]

[package]
name = "shelf_export"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shelf_export"
path = "source/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pulldown-cmark = "0.13.3"
zip = { version = "8", default-features = false }

[dev-dependencies]
roxmltree = "0.21"
tempfile = "3"
