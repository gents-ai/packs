type ShelfChapter {
  run_id: String @index
  chapter_key: String @index(unique: true) @immutable
  book_id: String @index
  sequence: Int
  title: String
  level: Int
  matter_type: String
  content_type: String
  start_page: Int
  end_page: Int
  source_ranges_json: String
  review_notes: String
}
