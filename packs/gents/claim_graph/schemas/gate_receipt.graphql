type GateReceipt {
  receipt_id: String @index(unique: true) @immutable
  batch_id: String @index @immutable
  graph_id: String @index @immutable
  verdict: String @index @immutable
  errors: String @immutable
  claims_admitted: Int @immutable
  edges_admitted: Int @immutable
  entities_admitted: Int @immutable
  perspectives_admitted: Int @immutable
  quotes_checked: Int @immutable
  quotes_skipped: Int @immutable
  profile_version: Int @immutable
  gate_version: String @immutable
  checked_at: String @immutable
}
