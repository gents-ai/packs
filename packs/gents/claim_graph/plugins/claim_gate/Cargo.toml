[workspace]

[package]
name = "claim_gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "claim_gate"
path = "source/main.rs"

[dependencies]
# preserve_order keeps a claim's `sources` objects in their written key order.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
