[workspace]

[package]
name = "review_evidence"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "review_evidence"
path = "source/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
