[workspace]

[package]
name = "review_changes"
version = "0.1.0"
edition = "2021"

[lib]
name = "review_changes"
path = "source/lib.rs"

[[bin]]
name = "review_changes"
path = "source/main.rs"

[dependencies]
# Default features off: no http or file reference retrieval (a schema must be self-contained).
jsonschema = { version = "=0.30.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
