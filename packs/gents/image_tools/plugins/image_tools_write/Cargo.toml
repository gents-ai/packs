[workspace]

[package]
name = "image_tools_write"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"

# The same program as image_tools, built under its own name so the pack can
# declare it with read-write access to the folder it is bound to. All the code
# and its tests are image_tools's.
[[bin]]
name = "image_tools_write"
path = "source/main.rs"

[dependencies]
image_tools = { path = "../image_tools" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
