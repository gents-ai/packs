[workspace]

[package]
name = "ocr"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"

[[bin]]
name = "ocr"
path = "source/main.rs"

[dependencies]
hayro = { version = "0.7.1", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
hayro-interpret = { version = "0.7.0", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
hayro-syntax = { version = "0.7.2", default-features = false, features = ["std"] }
html-escape = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
kurbo = "0.13"
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26.0", default-features = false, features = ["rten_format"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

[dev-dependencies]
flate2 = "1"

[[example]]
name = "gen_fixtures"
path = "tools/gen_fixtures.rs"

# Tests run the OCR models natively; unoptimized they are unusably slow.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
