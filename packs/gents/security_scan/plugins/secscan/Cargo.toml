[workspace]

[package]
name = "secscan"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secscan"
path = "source/main.rs"

[dependencies]
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
